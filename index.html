<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECKANKAR New Mexico Venue Finder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>ECKANKAR New Mexico Venue Finder</h1>
  </header>

  <section id="filters">
    <div class="filter-panel">
  <h2>Find a Venue</h2>

 <label for="city">City:</label>
<select id="city" required>
  <option value="">Select City</option>
  <option value="Albuquerque">Albuquerque</option>
  <option value="Rio Rancho">Rio Rancho</option>
  <option value="Santa Fe">Santa Fe</option>
  <option value="Las Cruces">Las Cruces</option>
  <option value="Silver City">Silver City</option>
  <option value="Roswell">Roswell</option>
  <option value="Los Lunas">Los Lunas</option>
  <option value="Los Alamos">Los Alamos</option>
  <option value="Taos">Taos</option>
</select>

  <label for="type">Type:</label>
  <select id="type" required>
    <option value="">Select Type</option>
    <option value="Library">Library</option>
    <option value="Community Center">Community Center</option>
    <option value="Hotel Meeting Room">Hotel Meeting Room</option>
    <option value="Event Space">Event Space</option>
  </select>

  <h3>Optional Filters</h3>

  <label for="size">Size:</label>
  <select id="size">
    <option value="">Any Size</option>
    <option value="10+">10+</option>
    <option value="20+">20+</option>
    <option value="40+">40+</option>
    <option value="60+">60+</option>
    <option value="100+">100+</option>
  </select>

  <label for="cost">Cost:</label>
  <select id="cost">
    <option value="">Any Cost</option>
    <option value="Free">Free</option>
    <option value="Under $50">Under $50</option>
    <option value="Under $100">Under $100</option>
    <option value="Under $200">Under $200</option>
  </select>

  <label for="tech">Tech:</label>
  <select id="tech">
    <option value="">Any Tech</option>
    <option value="WiFi">WiFi</option>
    <option value="Projector">Projector</option>
    <option value="A/V">A/V</option>
    <option value="Microphone">Microphone</option>
  </select>

  <label for="access">Access:</label>
  <select id="access">
    <option value="">Any Access</option>
    <option value="ADA">ADA</option>
    <option value="Parking">Parking</option>
    <option value="Both">Both</option>
  </select>

  <label for="setup">Setup:</label>
  <select id="setup">
    <option value="">Any Setup</option>
    <option value="Easy">Easy</option>
    <option value="Standard">Standard</option>
    <option value="Limited">Limited</option>
  </select>

  <button id="generate">Generate Word Table</button>
</div>

  </section>

  <section id="output">
    <!-- Word‑ready output will appear here -->
  </section>

  <script src="app.js"></script>
</body>
</html>
